        update-types:
          - major
    commit-message:
      prefix: deps

  # npm - sdk/ and tools/: majors stay as individual PRs.
  - package-ecosystem: npm
    directories:
      - "/sdk"
      - "/sdk/**/*"
      - "/tools"
