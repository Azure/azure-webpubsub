# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Build

on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/build.yml'
      - 'package.json'
      - 'yarn.lock'
      - 'sdk/**'
      - 'tools/**'
      - 'samples/**'
      - 'experimental/**'
      # Root workspace manifests: they pin the dependency versions used by
      # tools/awps-tunnel/client and tools/awps-tunnel/server.
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/build.yml'
      - 'package.json'
      - 'yarn.lock'
      - 'sdk/**'
      - 'tools/**'
      - 'samples/**'
      - 'experimental/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/build.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect affected components
    runs-on: ubuntu-latest
    outputs:
      javascript: ${{ steps.filter.outputs.javascript }}
      chat_client: ${{ steps.filter.outputs.chat_client }}
      csharp: ${{ steps.filter.outputs.csharp }}
      java: ${{ steps.filter.outputs.java }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            javascript:
              - 'package.json'
              - 'yarn.lock'
              - 'sdk/**'
              - 'tools/vscode-azurewebpubsub/**'
              - 'tools/awps-tunnel/**'
              - 'samples/javascript/**'
              - 'experimental/**'
            chat_client:
              - 'sdk/webpubsub-chat-client/**'
            csharp:
              - 'samples/csharp/**'
            java:
              - 'samples/java/**'
            python:
              - 'samples/python/**'

  javascript:
    name: Build and Test JS code and samples
    needs: changes
    if: needs.changes.outputs.javascript == 'true'
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_REGISTRY: 'https://packagefeedproxy.microsoft.io/npm/'
    strategy:
      matrix:
        node-version: [22.20.0]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Test VSCode Extension
      # See https://code.visualstudio.com/api/working-with-extensions/continuous-integration#github-actions
      run:  cd ./tools/vscode-azurewebpubsub && npm ci && xvfb-run -a npm run test && cd ../../
      if: runner.os == 'Linux'
    - name: Install and Test All Samples
      run: |
        find ./samples/javascript ./experimental -name 'node_modules' -prune -o -name 'package.json' -print0 | while IFS= read -r -d '' file; do
          dir=$(dirname "$file")
          echo "Processing directory: $dir"
          cd "$dir"
          
          echo "Installing dependencies in $dir"
          npm install
          
          echo "Running tests in $dir"
          npm run test
          
          echo "Finished tests in $dir"
          cd - > /dev/null
        done
    - run: npm install -g yarn
    - run: yarn install
    - run: yarn workspaces run test
    - name: Build awps-tunnel
      run: |
        pushd sdk/server-proxies
        yarn
        popd        
        pushd tools/awps-tunnel/client
        yarn
        popd
        pushd tools/awps-tunnel/server
        yarn
        yarn build
        popd
      shell: bash

  chat-client:
    name: Build and Test Chat Client (20.x)
    needs: changes
    if: needs.changes.outputs.chat_client == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use Node.js 20.x
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 20.x
    - name: Install Yarn
      run: npm install --global yarn@1.22.22 --registry https://packagefeedproxy.microsoft.io/npm/
    - name: Build and test chat client
      working-directory: sdk/webpubsub-chat-client
      run: |
        yarn install --frozen-lockfile --registry https://packagefeedproxy.microsoft.io/npm/
        yarn build
        yarn build:bundle
        yarn extract-api
        git diff --exit-code -- review/
        yarn test:unit

  csharp:
    name: Build and Test C#
    needs: changes
    if: needs.changes.outputs.csharp == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: [8.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      - name: Build C# samples
        run: dotnet build samples/csharp/samples.sln

  # Java Stage
  java:
    name: Build and Test Java
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Build and Test Java Projects
        run: |
          find ./samples/java -name 'pom.xml' -print0 | while IFS= read -r -d '' file; do
            dir=$(dirname "$file")
            echo "Building and testing Java project in $dir"
            cd "$dir"
            mvn clean install
            mvn test
            cd - > /dev/null
          done

  # Python Stage
  python:
    name: Build and Test Python
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies and Test Python Projects
        run: |
          find ./samples/python -name 'requirements.txt' -print0 | while IFS= read -r -d '' file; do
            dir=$(dirname "$file")
            echo "Installing dependencies for Python project in $dir"
            cd "$dir"
            pip install -r requirements.txt
            echo "Running tests for Python project in $dir"
            pytest --maxfail=0 --disable-warnings --junitxml=results.xml --ignore=node_modules --ignore=venv || true
            TEST_COUNT=$(grep -o 'tests="[^"]*"' results.xml | sed 's/tests="//g' | sed 's/"//g')
            FAILED_COUNT=$(grep -o 'failures="[^"]*"' results.xml | sed 's/failures="//g' | sed 's/"//g')

            echo "Tests found: $TEST_COUNT"
            echo "Tests failed: $FAILED_COUNT"

            if [[ "$TEST_COUNT" -gt 0 && "$FAILED_COUNT" -gt 0 ]]; then
              echo "Tests ran and some tests failed in $dir. Failing the job."
              exit 1
            elif [[ "$TEST_COUNT" -eq 0 ]]; then
              echo "No tests found for $dir. Exiting successfully."
            else
              echo "All tests passed in $dir. Exiting successfully."
            fi
            cd - > /dev/null
          done
