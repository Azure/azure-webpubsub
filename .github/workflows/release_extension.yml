name: Release VSCode Extension

on: 
  push:
    branches:
      - main
    paths:
        - 'tools/vscode-azurewebpubsub/**'
        - '.github/workflows/release_extension.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/vscode-azurewebpubsub/**'
      - '.github/workflows/release_extension.yml'

permissions:
  contents: read

jobs:
  build_pack_upload:
    name: Release VSCode Extension
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_REGISTRY: 'https://packagefeedproxy.microsoft.io/npm/'
    defaults:
      run:
        working-directory: tools/vscode-azurewebpubsub
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.20.0

      - name: Build and Pack
        run: npm ci && npm run build && npm run package

      - name: Get Metadata
        id: metadata_step
        run: |
            package_version=$(node -p "require('./package.json').version")
            echo "package_version=${package_version}" >> $GITHUB_OUTPUT
            echo "vsix_filename=$(ls *.vsix)" >> $GITHUB_OUTPUT

      - name: Upload to Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
            name: ${{ steps.metadata_step.outputs.vsix_filename }}
            path: tools/vscode-azurewebpubsub/${{ steps.metadata_step.outputs.vsix_filename }}

      # TODO: release to npm