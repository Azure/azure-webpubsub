name: deploy-demo-website

on:
    push:
        branches: main # todo: set 'main' auto deploy once everything works
        paths:
            - 'samples/**'
            - 'website/**'

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

permissions:
  contents: write # Grant write permissions for this workflow only

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
    publish:
        name: Deploy demo website
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: main
            - name: Build demo website
              run: |
                  cd website
                  npm install 
                  npm run build
              env:
                  trackingID: G-9DVQRCY9L7
                  gtmTrackingID: GTM-N67NT6N
            - name: Deploy to GitHub Pages
              if: success()
              uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
              with:
                  target_branch: gh-pages
                  build_dir: website/build
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
