name: Protobuf Client Tests

on:
  push:
    branches: ["main"]
    paths:
      - 'sdk/clients/protobuf-client/csharp/**'
      - 'protocols/protobuf.webpubsub.azure.v1/**'
      - 'samples/javascript/videoshare/**'
      - 'samples/python/logstream-protobuf/**'
      - '.github/workflows/protobuf-client-tests.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'sdk/clients/protobuf-client/csharp/**'
      - 'protocols/protobuf.webpubsub.azure.v1/**'
      - 'samples/javascript/videoshare/**'
      - 'samples/python/logstream-protobuf/**'
      - '.github/workflows/protobuf-client-tests.yml'

permissions:
  contents: read

jobs:
  javascript:
    name: Test shared schema in JavaScript
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_REGISTRY: 'https://packagefeedproxy.microsoft.io/npm/'
    defaults:
      run:
        working-directory: samples/javascript/videoshare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.20.0'
      - run: npm install --package-lock=false
      - run: npm test

  python:
    name: Test shared schema in Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/python/logstream-protobuf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install --index-url https://packagefeedproxy.microsoft.io/pypi/simple -r requirements.txt
      - run: python -m unittest -v test_codec

  test:
    name: Build and Test Protobuf Client
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: [8.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore sdk/clients/protobuf-client/csharp/Azure.Messaging.WebPubSub.Client.Protobuf.sln

      - name: Build solution
        run: dotnet build sdk/clients/protobuf-client/csharp/Azure.Messaging.WebPubSub.Client.Protobuf.sln --no-restore

      - name: Run tests
        run: dotnet test sdk/clients/protobuf-client/csharp/Azure.Messaging.WebPubSub.Client.Protobuf.sln --no-build

      - name: Build Samples
        run: |
          dotnet build sdk/clients/protobuf-client/csharp/samples/WebPubSubProtobufSample/WebPubSubProtobufSample.csproj
