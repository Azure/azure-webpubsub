# Publish an already-built npm package, then tag it and prepare the next beta.
# These jobs run inside the manually triggered production release stage.

parameters:
  - name: package_key
    type: string
  - name: package_name
    type: string
  - name: package_folder
    type: string
  - name: npm_package_name
    type: string
  - name: esrp_service_connection
    type: string
    default: '$(ESRP_SERVICE_CONNECTION)'
  - name: github_repo
    type: string
    default: 'Azure/azure-webpubsub'
  - name: node_version
    type: string
    default: '22.x'

jobs:
  - job: ${{ format('{0}_publish', parameters.package_key) }}
    displayName: 'Publish ${{ parameters.package_name }} through ESRP'
    dependsOn:
      - verify
      - approve
    condition: |
      and(
        not(canceled()),
        eq(dependencies.verify.result, 'Succeeded'),
        eq(dependencies.approve.result, 'Succeeded'),
        eq(variables['needsRelease'], 'true')
      )
    pool:
      type: release
      os: windows
    variables:
      needsRelease: $[ dependencies.verify.outputs['read.${{ parameters.package_key }}_needsRelease'] ]
      releaseVersion: $[ dependencies.verify.outputs['read.${{ parameters.package_key }}_releaseVersion'] ]
      productState: $[ dependencies.verify.outputs['read.${{ parameters.package_key }}_productState'] ]
      ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
      ob_sdl_codeSignValidation_enabled: false
      ob_sdl_binskim_enabled: false
    templateContext:
      inputs:
        - input: pipelineArtifact
          artifactName: 'drop_${{ parameters.package_name }}'
          targetPath: '$(Pipeline.Workspace)/esrp-release/$(Build.BuildId)/${{ parameters.package_key }}'
    steps:
      - checkout: self
        path: s/azure-webpubsub
        fetchDepth: 1
        persistCredentials: true
      - task: UseNode@1
        displayName: 'Use Node ${{ parameters.node_version }}'
        inputs:
          version: ${{ parameters.node_version }}
      - task: PowerShell@2
        displayName: 'Check public npm version and GitHub tag availability'
        inputs:
          pwsh: true
          targetType: inline
          workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
          script: |
            $ErrorActionPreference = 'Stop'
            & node .pipelines/scripts/Npm-Release.mjs check `
              '${{ parameters.package_folder }}' `
              '${{ parameters.npm_package_name }}' `
              '${{ parameters.package_name }}' `
              '$(releaseVersion)' `
              '${{ parameters.github_repo }}'
            if ($LASTEXITCODE -ne 0) { throw 'Public package availability checks failed.' }
      - task: EsrpRelease@11
        displayName: 'Publish npm package through ESRP'
        inputs:
          ConnectedServiceName: ${{ parameters.esrp_service_connection }}
          ClientId: '$(ESRP_CLIENT_ID)'
          DomainTenantId: '$(ESRP_TENANT_ID)'
          UseManagedIdentity: true
          KeyVaultName: '$(ESRP_KEY_VAULT_NAME)'
          SignCertName: '$(ESRP_SIGN_CERT_NAME)'
          Intent: 'PackageDistribution'
          ContentType: 'npm'
          ContentSource: 'Folder'
          FolderLocation: '$(Pipeline.Workspace)/esrp-release/$(Build.BuildId)/${{ parameters.package_key }}'
          Owners: '$(ESRP_OWNERS)'
          Approvers: '$(ESRP_APPROVERS)'
          ServiceEndpointUrl: 'https://api.esrp.microsoft.com'
          MainPublisher: '$(ESRP_MAIN_PUBLISHER)'
          ProductState: '$(productState)'

  - job: ${{ format('{0}_post_deploy_tag', parameters.package_key) }}
    displayName: 'Tag ${{ parameters.package_name }} release'
    dependsOn:
      - verify
      - ${{ format('{0}_publish', parameters.package_key) }}
    condition: |
      and(
        not(canceled()),
        eq(dependencies.verify.result, 'Succeeded'),
        eq(dependencies.${{ format('{0}_publish', parameters.package_key) }}.result, 'Succeeded')
      )
    pool:
      type: release
      os: linux
    variables:
      releaseVersion: $[ dependencies.verify.outputs['read.${{ parameters.package_key }}_releaseVersion'] ]
      ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
      ob_sdl_codeSignValidation_enabled: false
      ob_sdl_binskim_enabled: false
    steps:
      - checkout: self
        path: s/azure-webpubsub
        fetchDepth: 1
        fetchTags: true
        persistCredentials: true
      - task: Bash@3
        displayName: 'Create and push release tag'
        inputs:
          targetType: inline
          workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
          script: |
            set -euo pipefail
            tag="release/${{ parameters.package_name }}/v$(releaseVersion)"

            if git rev-parse --verify "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "Tag ${tag} already exists locally. Skipping."
              exit 0
            fi

            git config --global user.name 'azure-webpubsub-release-bot'
            git config --global user.email 'azure-webpubsub-release-bot@users.noreply.github.com'
            git tag "${tag}"
            git push origin "${tag}"

  - job: ${{ format('{0}_post_deploy_pr', parameters.package_key) }}
    displayName: 'Open ${{ parameters.package_name }} beta bump PR'
    dependsOn:
      - verify
      - ${{ format('{0}_publish', parameters.package_key) }}
      - ${{ format('{0}_post_deploy_tag', parameters.package_key) }}
    condition: |
      and(
        not(canceled()),
        eq(dependencies.verify.result, 'Succeeded'),
        eq(dependencies.${{ format('{0}_publish', parameters.package_key) }}.result, 'Succeeded'),
        eq(dependencies.${{ format('{0}_post_deploy_tag', parameters.package_key) }}.result, 'Succeeded')
      )
    pool:
      type: release
      os: linux
    variables:
      releaseVersion: $[ dependencies.verify.outputs['read.${{ parameters.package_key }}_releaseVersion'] ]
      ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
      ob_sdl_codeSignValidation_enabled: false
      ob_sdl_binskim_enabled: false
    steps:
      - checkout: self
        path: s/azure-webpubsub
        fetchDepth: 1
        persistCredentials: true
      - task: UseNode@1
        displayName: 'Use Node ${{ parameters.node_version }}'
        inputs:
          version: ${{ parameters.node_version }}
      - task: Bash@3
        displayName: 'Bump package.json and changelog, then open GitHub PR'
        inputs:
          targetType: inline
          workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
          script: |
            set -euo pipefail

            PACKAGE_FOLDER='${{ parameters.package_folder }}'
            PACKAGE_NAME='${{ parameters.package_name }}'

            package_json="$PACKAGE_FOLDER/package.json"
            current_version='$(releaseVersion)'
            new_version=$(node .pipelines/scripts/Npm-Release.mjs bump "$PACKAGE_FOLDER" "$current_version")
            branch="auto/upv-${PACKAGE_NAME}-${new_version}"
            echo "Current: $current_version  ->  Next: $new_version"
            echo "Branch:  $branch"

            git config --global user.name 'azure-webpubsub-release-bot'
            git config --global user.email 'azure-webpubsub-release-bot@users.noreply.github.com'
            git checkout -b "$branch"
            git add "$package_json" "$PACKAGE_FOLDER/CHANGELOG.md"
            git commit -m "Update ${PACKAGE_NAME} to next beta version ${new_version}"
            git push origin "$branch"

            auth_header=$(git config --get-urlmatch http.extraheader "https://github.com/${{ parameters.github_repo }}" || true)
            if [ -z "$auth_header" ]; then
              echo "ERROR: no extraheader found in .git/config. Is checkout.persistCredentials true?"
              exit 1
            fi

            pr_body=$(BRANCH="$branch" NEW_VERSION="$new_version" PACKAGE_NAME="$PACKAGE_NAME" node -e "console.log(JSON.stringify({
              title: 'Update package.json to next beta version ' + process.env.NEW_VERSION,
              head: process.env.BRANCH,
              base: 'main',
              body: 'This PR updates ' + process.env.PACKAGE_NAME + ' package.json and CHANGELOG.md to the next beta version.'
            }))")

            curl -fsSL -X POST \
              -H "$auth_header" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${{ parameters.github_repo }}/pulls" \
              -d "$pr_body"
