parameters:
  - name: action
    type: string
    values: [version, latest]
  - name: prerequisite_stage
    type: string
  - name: prerequisite_job
    type: string
  - name: azure_service_connection
    type: string

stages:
  - template: release-approval.yml
    parameters:
      package_key: emulator_container_${{ parameters.action }}
      package_title: Docker ${{ parameters.action }}

  # Manual entry stages cannot have dependencies. Enforce prerequisites here,
  # including the actual job result so a skipped job cannot authorize publication.
  - stage: Prod_emulator_container_${{ parameters.action }}_publish
    displayName: 'Publish Docker ${{ parameters.action }}'
    isSkippable: false
    dependsOn:
      - ${{ parameters.prerequisite_stage }}
      - Prod_emulator_container_${{ parameters.action }}_approve
    condition: |
      and(
        not(canceled()),
        eq(dependencies.${{ parameters.prerequisite_stage }}.result, 'Succeeded'),
        eq(dependencies.Prod_emulator_container_${{ parameters.action }}_approve.result, 'Succeeded'),
        or(
          eq(variables['Build.SourceBranch'], 'refs/heads/main'),
          startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')
        )
      )
    # Both operations must use the same service connection's Exclusive lock check.
    lockBehavior: sequential
    variables:
      ob_release_environment: Production
    jobs:
      - job: publish
        dependsOn: []
        condition: and(not(canceled()), eq(variables['prerequisiteResult'], 'Succeeded'))
        pool:
          type: release
          os: linux
        variables:
          prerequisiteResult: $[ stageDependencies.${{ parameters.prerequisite_stage }}.${{ parameters.prerequisite_job }}.result ]
          # Use the same cached ORAS executable for transport and read-back verification.
          ORAS_VERSION: latest
        templateContext:
          inputs:
            - input: pipelineArtifact
              artifactName: drop_emulator_container
              targetPath: '$(Pipeline.Workspace)/drop_emulator_container'
        steps:
          - task: PowerShell@2
            displayName: 'Validate tested Docker artifact'
            inputs:
              pwsh: true
              filePath: '$(Pipeline.Workspace)/drop_emulator_container/Publish-EmulatorContainer.ps1'
              arguments: '-ArtifactDirectory "$(Pipeline.Workspace)/drop_emulator_container" -Action ${{ parameters.action }}'
            env:
              CONTAINER_ACR_RESOURCE_ID: $(EmulatorContainerRegistryResourceId)
              CONTAINER_RELEASE_REPOSITORY: $(EmulatorContainerReleaseRepository)
          - task: ContainerSecuritySetup@2
            displayName: 'Initialize container image transport'
            inputs:
              skipBuildkitWorker: true
          # Docker@1 supports ARM/WIF connections for registry-only authentication.
          - task: Docker@1
            displayName: 'Authenticate to the container registry'
            inputs:
              containerregistrytype: 'Azure Container Registry'
              azureSubscriptionEndpoint: ${{ parameters.azure_service_connection }}
              azureContainerRegistry: '$(emulatorRegistry)'
              command: login
          - task: ContainerSecurityCopyImage@2
            displayName: 'Load tested image archive'
            inputs:
              image: '$(emulatorImageReference)'
              sourceType: tarball
              sourceTarballPath: '$(emulatorArchivePath)'
              targetType: ociLayout
              targetOciLayout: '$(Agent.TempDirectory)/emulator-image'
          - task: ContainerSecurityCopyImage@2
            displayName: 'Publish Docker ${{ parameters.action }}'
            inputs:
              image: '$(emulatorImageReference)'
              sourceType: ociLayout
              sourceOciLayout: '$(Agent.TempDirectory)/emulator-image'
              targetType: remoteImage
              targetRemoteImages: '$(emulatorTargetImage)'
          - task: PowerShell@2
            displayName: 'Verify published Docker ${{ parameters.action }}'
            inputs:
              pwsh: true
              filePath: '$(Pipeline.Workspace)/drop_emulator_container/Verify-EmulatorContainer.ps1'
              arguments: >-
                -OciLayout "$(Agent.TempDirectory)/emulator-image"
                -ImageReference "$(emulatorImageReference)"
                -TargetImage "$(emulatorTargetImage)"
                -OrasPath "$(Agent.ToolsDirectory)/oras/$(ORAS_VERSION)/x64/oras"
