# Build, test, and pack an npm package for later manual publication.

parameters:
  - name: package_key
    displayName: 'Package key'
    type: string
  - name: package_title
    displayName: 'Package title'
    type: string
  - name: package_name
    displayName: 'Package name'
    type: string
  - name: package_folder
    displayName: 'Package folder'
    type: string
  - name: npm_package_name
    displayName: 'npm package name'
    type: string
  - name: pack_steps
    displayName: 'Build and pack steps'
    type: stepList
  - name: npm_feed_registry
    displayName: 'npm registry'
    type: string
    default: '$(NPM_FEED_REGISTRY)'
  - name: node_version
    displayName: 'Node.js version'
    type: string
    default: '22.x'

stages:
  - stage: ${{ format('{0}_build', parameters.package_key) }}
    displayName: 'Build ${{ parameters.package_title }}'
    dependsOn: []
    isSkippable: false
    condition: |
      and(
        not(canceled()),
        or(
          eq(variables['Build.SourceBranch'], 'refs/heads/main'),
          eq(variables['Build.Reason'], 'Manual')
        )
      )
    jobs:
      - job: build
        displayName: 'Build and pack'
        pool:
          type: linux
        variables:
          ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
          ob_artifactBaseName: 'drop_${{ parameters.package_name }}'
          ob_sdl_codeSignValidation_enabled: false
          ob_sdl_binskim_enabled: false
        steps:
          - checkout: self
            path: s/azure-webpubsub
            fetchDepth: 1
            persistCredentials: false
          - task: UseNode@1
            displayName: 'Use Node ${{ parameters.node_version }}'
            inputs:
              version: ${{ parameters.node_version }}
          - task: Bash@3
            name: read
            displayName: 'Check version'
            inputs:
              targetType: inline
              workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
              script: |
                set -euo pipefail
                node .pipelines/scripts/Get-ReleasePackages.mjs ${{ parameters.package_key }}
          - task: Bash@3
            displayName: 'Configure npm feed'
            inputs:
              targetType: inline
              workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
              script: |
                set -euo pipefail
                feed_registry='${{ parameters.npm_feed_registry }}'
                if [[ -z "$feed_registry" || "$feed_registry" == '$('* ]]; then
                  echo 'ERROR: NPM_FEED_REGISTRY is not configured.'
                  exit 1
                fi
                printf 'registry=%s\nalways-auth=true\n' "$feed_registry" > .npmrc
          - task: npmAuthenticate@0
            displayName: 'Authenticate npm'
            inputs:
              workingFile: '$(Pipeline.Workspace)/s/azure-webpubsub/.npmrc'
          - task: Bash@3
            displayName: 'Install Yarn'
            inputs:
              targetType: inline
              workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
              script: |
                set -euo pipefail
                feed_registry='${{ parameters.npm_feed_registry }}'
                yarn_root='$(Agent.TempDirectory)/yarn-1.22.22'
                mkdir -p "$yarn_root"
                curl --fail --location \
                  --header "Authorization: Bearer $SYSTEM_ACCESSTOKEN" \
                  "${feed_registry}yarn/-/yarn-1.22.22.tgz" \
                  --output '$(Agent.TempDirectory)/yarn-1.22.22.tgz'
                tar -xzf '$(Agent.TempDirectory)/yarn-1.22.22.tgz' --strip-components=1 -C "$yarn_root"
                export PATH="$yarn_root/bin:$PATH"
                echo "##vso[task.prependpath]$yarn_root/bin"
                yarn config set registry "$feed_registry"
                find . -name yarn.lock -type f -exec sed -Ei \
                  "s#https://registry\\.(npmjs\\.org|yarnpkg\\.com)/#${feed_registry}#g" {} +
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          - task: Bash@3
            displayName: 'Clean tarballs'
            inputs:
              targetType: inline
              workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
              script: |
                set -euo pipefail
                rm -f '${{ parameters.package_folder }}'/*.tgz
          - ${{ each step in parameters.pack_steps }}:
              - ${{ step }}
          - task: Bash@3
            name: locate
            displayName: 'Validate tarball'
            inputs:
              targetType: inline
              workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
              script: |
                set -euo pipefail
                PACKAGE_FOLDER='${{ parameters.package_folder }}'
                cd "$PACKAGE_FOLDER"
                tarballs=( *.tgz )
                if [ ${#tarballs[@]} -ne 1 ] || [ ! -f "${tarballs[0]}" ]; then
                  echo "ERROR: expected exactly one *.tgz in $PACKAGE_FOLDER, found: ${tarballs[*]}"
                  exit 1
                fi
                tarball_name="${tarballs[0]}"
                tarball_path="$(pwd)/$tarball_name"
                package_metadata=$(tar -xOf "$tarball_path" package/package.json)
                packed_name=$(printf '%s' "$package_metadata" | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data).name));")
                packed_version=$(printf '%s' "$package_metadata" | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data).version));")
                if [ "$packed_name" != '${{ parameters.npm_package_name }}' ]; then
                  echo "ERROR: expected package name ${{ parameters.npm_package_name }}, found $packed_name"
                  exit 1
                fi
                if [ "$packed_version" != "$(read.${{ parameters.package_key }}_releaseVersion)" ]; then
                  echo "ERROR: expected package version $(read.${{ parameters.package_key }}_releaseVersion), found $packed_version"
                  exit 1
                fi
                echo "Tarball: $tarball_path"
                cp "$tarball_path" "$(ob_outputDirectory)/"
