# Select, publish, and finalize an npm package using this run's build artifacts.

parameters:
  - name: package_key
    type: string
  - name: package_title
    type: string
  - name: package_name
    type: string
  - name: npm_package_name
    type: string
  - name: package_folder
    type: string

stages:
  - template: release-approval.yml
    parameters:
      package_key: ${{ parameters.package_key }}
      package_title: ${{ parameters.package_title }}

  - stage: Prod_${{ parameters.package_key }}_publish
    displayName: 'Publish ${{ parameters.package_title }}'
    isSkippable: false
    dependsOn:
      - ${{ parameters.package_key }}_build
      - Prod_${{ parameters.package_key }}_approve
    condition: |
      and(
        not(canceled()),
        eq(dependencies.Prod_${{ parameters.package_key }}_approve.result, 'Succeeded'),
        eq(dependencies.${{ parameters.package_key }}_build.result, 'Succeeded')
      )
    variables:
      ob_release_environment: Production
    jobs:
      - job: ${{ parameters.package_key }}_publish
        displayName: 'Publish ${{ parameters.package_title }}'
        dependsOn: []
        condition: |
          and(
            not(canceled()),
            eq(variables['buildResult'], 'Succeeded')
          )
        pool:
          type: release
          os: windows
        variables:
          buildResult: $[ stageDependencies.${{ parameters.package_key }}_build.build.result ]
          releaseVersion: $[ stageDependencies.${{ parameters.package_key }}_build.build.outputs['read.${{ parameters.package_key }}_releaseVersion'] ]
          productState: $[ stageDependencies.${{ parameters.package_key }}_build.build.outputs['read.${{ parameters.package_key }}_productState'] ]
          ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
          ob_sdl_codeSignValidation_enabled: false
          ob_sdl_binskim_enabled: false
        templateContext:
          inputs:
            - input: pipelineArtifact
              artifactName: 'drop_${{ parameters.package_name }}'
              targetPath: '$(Pipeline.Workspace)/esrp-release/$(Build.BuildId)/${{ parameters.package_key }}'
        steps:
          - task: UseNode@1
            displayName: 'Use Node 22.x'
            inputs:
              version: '22.x'
          - task: PowerShell@2
            displayName: 'Check npm and tag'
            inputs:
              pwsh: true
              targetType: inline
              script: |
                $ErrorActionPreference = 'Stop'
                & node '$(Pipeline.Workspace)/esrp-release/$(Build.BuildId)/${{ parameters.package_key }}/release/Npm-Release.mjs' check `
                  '$(Pipeline.Workspace)/esrp-release/$(Build.BuildId)/${{ parameters.package_key }}/npm' `
                  '${{ parameters.npm_package_name }}' `
                  '${{ parameters.package_name }}' `
                  '$(releaseVersion)' `
                  'Azure/azure-webpubsub'
                if ($LASTEXITCODE -ne 0) { throw 'Public package availability checks failed.' }
          - task: EsrpRelease@11
            displayName: 'Publish to npm'
            inputs:
              ConnectedServiceName: $(ESRP_SERVICE_CONNECTION)
              ClientId: '$(ESRP_CLIENT_ID)'
              DomainTenantId: '$(ESRP_TENANT_ID)'
              UseManagedIdentity: true
              KeyVaultName: '$(ESRP_KEY_VAULT_NAME)'
              SignCertName: '$(ESRP_SIGN_CERT_NAME)'
              Intent: 'PackageDistribution'
              ContentType: 'npm'
              ContentSource: 'Folder'
              FolderLocation: '$(Pipeline.Workspace)/esrp-release/$(Build.BuildId)/${{ parameters.package_key }}/npm'
              Owners: '$(ESRP_OWNERS)'
              Approvers: '$(ESRP_APPROVERS)'
              ServiceEndpointUrl: 'https://api.esrp.microsoft.com'
              MainPublisher: '$(ESRP_MAIN_PUBLISHER)'
              ProductState: '$(productState)'

  - stage: ${{ parameters.package_key }}_release_finalize
    displayName: 'Finalize ${{ parameters.package_title }}'
    isSkippable: false
    dependsOn:
      - ${{ parameters.package_key }}_build
      - Prod_${{ parameters.package_key }}_approve
      - Prod_${{ parameters.package_key }}_publish
    condition: |
      and(
        not(canceled()),
        eq(dependencies.Prod_${{ parameters.package_key }}_approve.result, 'Succeeded'),
        eq(dependencies.${{ parameters.package_key }}_build.result, 'Succeeded'),
        eq(dependencies.Prod_${{ parameters.package_key }}_publish.result, 'Succeeded')
      )
    jobs:
      - job: ${{ parameters.package_key }}_finalize
        displayName: 'Finalize ${{ parameters.package_title }}'
        dependsOn: []
        condition: |
          and(
            not(canceled()),
            eq(variables['publishResult'], 'Succeeded')
          )
        pool:
          type: linux
        variables:
          publishResult: $[ stageDependencies.Prod_${{ parameters.package_key }}_publish.${{ parameters.package_key }}_publish.result ]
          releaseVersion: $[ stageDependencies.${{ parameters.package_key }}_build.build.outputs['read.${{ parameters.package_key }}_releaseVersion'] ]
          ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
          ob_sdl_codeSignValidation_enabled: false
          ob_sdl_binskim_enabled: false
        steps:
          - checkout: self
            path: s/azure-webpubsub
            fetchDepth: 1
            fetchTags: true
            persistCredentials: true
          - task: UseNode@1
            displayName: 'Use Node 22.x'
            inputs:
              version: '22.x'
          - task: Bash@3
            displayName: 'Push release tag'
            inputs:
              targetType: inline
              workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
              script: |
                set -euo pipefail
                tag="release/${{ parameters.package_name }}/v$(releaseVersion)"

                if git rev-parse --verify "refs/tags/${tag}" >/dev/null 2>&1; then
                  echo "Tag ${tag} already exists locally. Skipping."
                  exit 0
                fi

                git config --global user.name 'azure-webpubsub-release-bot'
                git config --global user.email 'azure-webpubsub-release-bot@users.noreply.github.com'
                git tag "${tag}"
                git push origin "${tag}"
          - task: Bash@3
            displayName: 'Open next-beta PR'
            inputs:
              targetType: inline
              workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
              script: |
                set -euo pipefail

                PACKAGE_FOLDER='${{ parameters.package_folder }}'
                PACKAGE_NAME='${{ parameters.package_name }}'

                package_json="$PACKAGE_FOLDER/package.json"
                current_version='$(releaseVersion)'
                new_version=$(node .pipelines/scripts/Npm-Release.mjs bump "$PACKAGE_FOLDER" "$current_version")
                branch="auto/upv-${PACKAGE_NAME}-${new_version}"
                echo "Current: $current_version  ->  Next: $new_version"
                echo "Branch:  $branch"

                git config --global user.name 'azure-webpubsub-release-bot'
                git config --global user.email 'azure-webpubsub-release-bot@users.noreply.github.com'
                git checkout -b "$branch"
                git add "$package_json" "$PACKAGE_FOLDER/CHANGELOG.md"
                git commit -m "Update ${PACKAGE_NAME} to next beta version ${new_version}"
                git push origin "$branch"

                auth_header=$(git config --get-urlmatch http.extraheader "https://github.com/Azure/azure-webpubsub" || true)
                if [ -z "$auth_header" ]; then
                  echo "ERROR: no extraheader found in .git/config. Is checkout.persistCredentials true?"
                  exit 1
                fi

                pr_body=$(BRANCH="$branch" NEW_VERSION="$new_version" PACKAGE_NAME="$PACKAGE_NAME" node -e "console.log(JSON.stringify({
                  title: 'Update package.json to next beta version ' + process.env.NEW_VERSION,
                  head: process.env.BRANCH,
                  base: 'main',
                  body: 'This PR updates ' + process.env.PACKAGE_NAME + ' package.json and CHANGELOG.md to the next beta version.'
                }))")

                curl -fsSL -X POST \
                  -H "$auth_header" \
                  -H 'Accept: application/vnd.github+json' \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "https://api.github.com/repos/Azure/azure-webpubsub/pulls" \
                  -d "$pr_body"
