# Build all packages and publish emulator previews; npm publication requires approval.

name: package-release_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  batch: true
  branches:
    include:
      - main

pr: none

variables:
  - group: 'npm-release'
  - name: CDP_DEFINITION_BUILD_COUNT
    value: $[counter('', 0)]
  - name: LinuxContainerImage
    value: 'mcr.microsoft.com/onebranch/azurelinux/build:3.0'

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main

extends:
  template: v2/OneBranch.Official.CrossPlat.yml@templates
  parameters:
    featureFlags:
      # Keep the 1ES publishing path when using a release-stage server approval job.
      use1esentry: true
      linuxEsrpSigning: true
      WindowsHostVersion:
        Version: 2022
    release:
      category: NonAzure
    globalSdl:
      tsa:
        enabled: false
      policheck:
        break: true
    stages:
      - stage: release_check
        displayName: 'Check release versions'
        isSkippable: false
        dependsOn: []
        condition: |
          and(
            not(canceled()),
            or(
              eq(variables['Build.SourceBranch'], 'refs/heads/main'),
              eq(variables['Build.Reason'], 'Manual')
            )
          )
        jobs:
          - job: check
            pool:
              type: linux
            variables:
              ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
              ob_sdl_codeSignValidation_enabled: false
              ob_sdl_binskim_enabled: false
            steps:
              - checkout: self
                path: s/azure-webpubsub
                fetchDepth: 1
                persistCredentials: false
              - task: UseNode@1
                displayName: 'Use Node 22.x'
                inputs:
                  version: '22.x'
              - task: Bash@3
                name: read
                displayName: 'Validate package and changelog versions'
                inputs:
                  targetType: inline
                  workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
                  script: |
                    set -euo pipefail
                    node .pipelines/scripts/Get-ReleasePackages.mjs

      - stage: emulator_build
        displayName: 'Build, sign, and validate formal and preview emulator packages'
        isSkippable: false
        dependsOn: release_check
        condition: |
          and(
            not(canceled()),
            eq(dependencies.release_check.result, 'Succeeded')
          )
        jobs:
          - job: build
            pool:
              type: linux
            variables:
              ob_outputDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub/out/emulator'
              ob_artifactBaseName: 'drop_emulator'
              ob_sdl_codeSignValidation_enabled: false
              ob_sdl_binskim_enabled: false
            steps:
              - checkout: self
                path: s/azure-webpubsub
                persistCredentials: false
                env:
                  # Relocate and clean the checkout before the signing watcher starts.
                  ob_restore_phase: true
              - task: UseDotNet@2
                displayName: 'Use emulator .NET SDK'
                inputs:
                  useGlobalJson: true
                  workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub/tools/emulator'
              - task: PowerShell@2
                displayName: 'Build and test emulator once at the release-note version'
                inputs:
                  pwsh: true
                  targetType: inline
                  workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
                  script: |
                    & ./.pipelines/scripts/Build-EmulatorPackage.ps1 `
                      -OutputDirectory '$(ob_outputDirectory)/release' `
                      -BuildId $env:BUILD_BUILDID -ReleaseVersion -Phase Build
              - task: onebranch.pipeline.signing@1
                displayName: 'Sign emulator assembly for both packages'
                inputs:
                  command: sign
                  signing_profile: external_distribution
                  # Tool packing consumes obj, not bin, even with --no-build.
                  files_to_sign: 'obj/Release/*/Microsoft.Azure.WebPubSub.Emulator.dll'
                  search_root: '$(Pipeline.Workspace)/s/azure-webpubsub/tools/emulator/src/Microsoft.Azure.WebPubSub.Emulator'
              - task: PowerShell@2
                displayName: 'Pack formal and preview packages without rebuilding'
                inputs:
                  pwsh: true
                  targetType: inline
                  workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
                  script: |
                    & ./.pipelines/scripts/Build-EmulatorPackage.ps1 `
                      -OutputDirectory '$(ob_outputDirectory)/release' `
                      -BuildId $env:BUILD_BUILDID -ReleaseVersion -Phase Pack
                    & ./.pipelines/scripts/Build-EmulatorPackage.ps1 `
                      -OutputDirectory '$(ob_outputDirectory)/preview' `
                      -BuildId $env:BUILD_BUILDID -Phase Pack
              - task: onebranch.pipeline.signing@1
                displayName: 'Sign formal NuGet package for download (no publication)'
                inputs:
                  command: sign
                  signing_profile: external_distribution
                  cp_code: CP-401405
                  files_to_sign: '*.nupkg'
                  search_root: '$(ob_outputDirectory)/release'
              - task: PowerShell@2
                displayName: 'Verify formal signature; install and smoke-test both packages'
                inputs:
                  pwsh: true
                  targetType: inline
                  workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
                  script: |
                    & ./.pipelines/scripts/Build-EmulatorPackage.ps1 `
                      -OutputDirectory '$(ob_outputDirectory)/release' `
                      -BuildId $env:BUILD_BUILDID -ReleaseVersion -Phase Validate -RequireSignature
                    & ./.pipelines/scripts/Build-EmulatorPackage.ps1 `
                      -OutputDirectory '$(ob_outputDirectory)/preview' `
                      -BuildId $env:BUILD_BUILDID -Phase Validate

      - template: templates/stages/release-package.yml
        parameters:
          package_key: chat_client
          package_name: web-pubsub-chat-client
          npm_package_name: '@azure/web-pubsub-chat-client'
          package_folder: sdk/webpubsub-chat-client
          pack_steps:
            - task: Bash@3
              displayName: 'Build, test, and pack chat client'
              inputs:
                targetType: inline
                workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
                script: |
                  set -euo pipefail
                  pushd sdk/webpubsub-chat-client
                  yarn --frozen-lockfile
                  npm run pack:publish
                  yarn test:unit
                  popd

      - template: templates/stages/release-package.yml
        parameters:
          package_key: socketio
          package_name: webpubsub-socketio-extension
          npm_package_name: '@azure/web-pubsub-socket.io'
          package_folder: sdk/webpubsub-socketio-extension
          pack_steps:
            - task: Bash@3
              displayName: 'Build, lint, test, and pack Socket.IO extension'
              inputs:
                targetType: inline
                workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
                script: |
                  set -euo pipefail
                  pushd sdk/server-proxies
                  yarn --frozen-lockfile
                  popd
                  pushd tools/awps-tunnel/client
                  yarn --frozen-lockfile
                  popd
                  pushd sdk/webpubsub-socketio-extension
                  yarn --frozen-lockfile
                  yarn build
                  yarn lint
                  yarn test:unit
                  yarn pack
                  popd

      - template: templates/stages/release-package.yml
        parameters:
          package_key: tunnel
          package_name: awps-tunnel
          npm_package_name: '@azure/web-pubsub-tunnel-tool'
          package_folder: tools/awps-tunnel/server
          pack_steps:
            - task: Bash@3
              displayName: 'Build, test, and pack tunnel tool'
              inputs:
                targetType: inline
                workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
                script: |
                  set -euo pipefail
                  pushd sdk/server-proxies
                  yarn --frozen-lockfile
                  popd
                  pushd tools/awps-tunnel/client
                  yarn --frozen-lockfile
                  popd
                  pushd tools/awps-tunnel/server
                  yarn --frozen-lockfile
                  yarn build
                  yarn test:unit --runInBand
                  yarn pack
                  popd

      - stage: emulator_myget
        displayName: 'Publish only the emulator preview to MyGet'
        isSkippable: false
        dependsOn:
          - release_check
          - emulator_build
        condition: |
          and(
            not(canceled()),
            eq(dependencies.release_check.result, 'Succeeded'),
            eq(dependencies.emulator_build.result, 'Succeeded'),
            or(
              eq(variables['Build.SourceBranch'], 'refs/heads/main'),
              eq(variables['Build.Reason'], 'Manual')
            )
          )
        variables:
          ob_release_environment: Test
        jobs:
          - job: publish
            pool:
              type: release
              os: windows
            variables:
              ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
              ob_sdl_codeSignValidation_enabled: false
              ob_sdl_binskim_enabled: false
            templateContext:
              inputs:
                - input: pipelineArtifact
                  artifactName: drop_emulator
                  targetPath: '$(Pipeline.Workspace)/drop_emulator'
            steps:
              - task: UseDotNet@2
                displayName: 'Use .NET 8 for Windows publishing tasks'
                inputs:
                  version: '8.x'
              # The OneBranch NuGetCommand wrapper forces DotNet, which cannot use this API-key connection.
              - task: 1ES.PublishNuGet@1
                displayName: 'Push validated emulator preview to MyGet'
                inputs:
                  useDotNetTask: false
                  packageParentPath: '$(Pipeline.Workspace)/drop_emulator/preview'
                  packagesToPush: '$(Pipeline.Workspace)/drop_emulator/preview/*.nupkg'
                  nuGetFeedType: external
                  publishFeedCredentials: azure-webpubsub-dev

      - stage: Prod_npm_release
        displayName: 'Approve npm release'
        dependsOn:
          - release_check
          - chat_client_build
          - socketio_build
          - tunnel_build
        isSkippable: false
        condition: |
          and(
            not(canceled()),
            eq(variables['Build.Reason'], 'Manual'),
            eq(dependencies.release_check.result, 'Succeeded'),
            eq(dependencies.chat_client_build.result, 'Succeeded'),
            eq(dependencies.socketio_build.result, 'Succeeded'),
            eq(dependencies.tunnel_build.result, 'Succeeded'),
            or(
              eq(variables['Build.SourceBranch'], 'refs/heads/main'),
              startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')
            )
          )
        variables:
          ob_release_environment: Production
        jobs:
          - job: approve
            displayName: 'Review npm packages before public publication'
            condition: not(canceled())
            pool:
              type: server
            timeoutInMinutes: 1500
            steps:
              - task: ManualValidation@1
                timeoutInMinutes: 1440
                inputs:
                  notifyUsers: ''
                  allowApproversToApproveTheirOwnRuns: true
                  instructions: 'Review the listed npm versions, successful builds, and tarballs. Approve to publish to npm, create release tags, and open next-beta PRs.'
                  onTimeout: reject

      - stage: npm_release_prepare
        displayName: 'Check npm and GitHub release availability'
        isSkippable: false
        dependsOn:
          - release_check
          - Prod_npm_release
        condition: |
          and(
            not(canceled()),
            eq(dependencies.Prod_npm_release.result, 'Succeeded')
          )
        jobs:
          - job: chat_client_check
            displayName: 'Check web-pubsub-chat-client release availability'
            condition: not(canceled())
            pool:
              type: linux
            variables:
              releaseVersion: $[ stageDependencies.release_check.check.outputs['read.chat_client_releaseVersion'] ]
              ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
              ob_sdl_codeSignValidation_enabled: false
              ob_sdl_binskim_enabled: false
            steps:
              - checkout: self
                path: s/azure-webpubsub
                fetchDepth: 1
                persistCredentials: true
              - task: UseNode@1
                displayName: 'Use Node 22.x'
                inputs:
                  version: 22.x
              - task: PowerShell@2
                displayName: 'Check public npm version and GitHub tag availability'
                inputs:
                  pwsh: true
                  targetType: inline
                  workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
                  script: |
                    $ErrorActionPreference = 'Stop'
                    & node .pipelines/scripts/Npm-Release.mjs check `
                      'sdk/webpubsub-chat-client' `
                      '@azure/web-pubsub-chat-client' `
                      'web-pubsub-chat-client' `
                      '$(releaseVersion)' `
                      'Azure/azure-webpubsub'
                    if ($LASTEXITCODE -ne 0) { throw 'Public package availability checks failed.' }

          - job: socketio_check
            displayName: 'Check webpubsub-socketio-extension release availability'
            condition: not(canceled())
            pool:
              type: linux
            variables:
              releaseVersion: $[ stageDependencies.release_check.check.outputs['read.socketio_releaseVersion'] ]
              ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
              ob_sdl_codeSignValidation_enabled: false
              ob_sdl_binskim_enabled: false
            steps:
              - checkout: self
                path: s/azure-webpubsub
                fetchDepth: 1
                persistCredentials: true
              - task: UseNode@1
                displayName: 'Use Node 22.x'
                inputs:
                  version: 22.x
              - task: PowerShell@2
                displayName: 'Check public npm version and GitHub tag availability'
                inputs:
                  pwsh: true
                  targetType: inline
                  workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
                  script: |
                    $ErrorActionPreference = 'Stop'
                    & node .pipelines/scripts/Npm-Release.mjs check `
                      'sdk/webpubsub-socketio-extension' `
                      '@azure/web-pubsub-socket.io' `
                      'webpubsub-socketio-extension' `
                      '$(releaseVersion)' `
                      'Azure/azure-webpubsub'
                    if ($LASTEXITCODE -ne 0) { throw 'Public package availability checks failed.' }

          - job: tunnel_check
            displayName: 'Check awps-tunnel release availability'
            condition: not(canceled())
            pool:
              type: linux
            variables:
              releaseVersion: $[ stageDependencies.release_check.check.outputs['read.tunnel_releaseVersion'] ]
              ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
              ob_sdl_codeSignValidation_enabled: false
              ob_sdl_binskim_enabled: false
            steps:
              - checkout: self
                path: s/azure-webpubsub
                fetchDepth: 1
                persistCredentials: true
              - task: UseNode@1
                displayName: 'Use Node 22.x'
                inputs:
                  version: 22.x
              - task: PowerShell@2
                displayName: 'Check public npm version and GitHub tag availability'
                inputs:
                  pwsh: true
                  targetType: inline
                  workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
                  script: |
                    $ErrorActionPreference = 'Stop'
                    & node .pipelines/scripts/Npm-Release.mjs check `
                      'tools/awps-tunnel/server' `
                      '@azure/web-pubsub-tunnel-tool' `
                      'awps-tunnel' `
                      '$(releaseVersion)' `
                      'Azure/azure-webpubsub'
                    if ($LASTEXITCODE -ne 0) { throw 'Public package availability checks failed.' }

      - stage: Prod_npm_publish
        displayName: 'Publish approved npm packages'
        isSkippable: false
        dependsOn:
          - release_check
          - Prod_npm_release
          - npm_release_prepare
        condition: |
          and(
            not(canceled()),
            eq(dependencies.Prod_npm_release.result, 'Succeeded')
          )
        variables:
          ob_release_environment: Production
        jobs:
          - job: chat_client_publish
            displayName: 'Publish web-pubsub-chat-client through ESRP'
            dependsOn: []
            condition: |
              and(
                not(canceled()),
                eq(variables['checkResult'], 'Succeeded')
              )
            pool:
              type: release
              os: windows
            variables:
              checkResult: $[ stageDependencies.npm_release_prepare.chat_client_check.result ]
              releaseVersion: $[ stageDependencies.release_check.check.outputs['read.chat_client_releaseVersion'] ]
              productState: $[ stageDependencies.release_check.check.outputs['read.chat_client_productState'] ]
              ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
              ob_sdl_codeSignValidation_enabled: false
              ob_sdl_binskim_enabled: false
            templateContext:
              inputs:
                - input: pipelineArtifact
                  artifactName: 'drop_web-pubsub-chat-client'
                  targetPath: '$(Pipeline.Workspace)/esrp-release/$(Build.BuildId)/chat_client'
            steps:
              - task: EsrpRelease@11
                displayName: 'Publish npm package through ESRP'
                inputs:
                  ConnectedServiceName: $(ESRP_SERVICE_CONNECTION)
                  ClientId: '$(ESRP_CLIENT_ID)'
                  DomainTenantId: '$(ESRP_TENANT_ID)'
                  UseManagedIdentity: true
                  KeyVaultName: '$(ESRP_KEY_VAULT_NAME)'
                  SignCertName: '$(ESRP_SIGN_CERT_NAME)'
                  Intent: 'PackageDistribution'
                  ContentType: 'npm'
                  ContentSource: 'Folder'
                  FolderLocation: '$(Pipeline.Workspace)/esrp-release/$(Build.BuildId)/chat_client'
                  Owners: '$(ESRP_OWNERS)'
                  Approvers: '$(ESRP_APPROVERS)'
                  ServiceEndpointUrl: 'https://api.esrp.microsoft.com'
                  MainPublisher: '$(ESRP_MAIN_PUBLISHER)'
                  ProductState: '$(productState)'

          - job: socketio_publish
            displayName: 'Publish webpubsub-socketio-extension through ESRP'
            dependsOn: []
            condition: |
              and(
                not(canceled()),
                eq(variables['checkResult'], 'Succeeded')
              )
            pool:
              type: release
              os: windows
            variables:
              checkResult: $[ stageDependencies.npm_release_prepare.socketio_check.result ]
              releaseVersion: $[ stageDependencies.release_check.check.outputs['read.socketio_releaseVersion'] ]
              productState: $[ stageDependencies.release_check.check.outputs['read.socketio_productState'] ]
              ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
              ob_sdl_codeSignValidation_enabled: false
              ob_sdl_binskim_enabled: false
            templateContext:
              inputs:
                - input: pipelineArtifact
                  artifactName: 'drop_webpubsub-socketio-extension'
                  targetPath: '$(Pipeline.Workspace)/esrp-release/$(Build.BuildId)/socketio'
            steps:
              - task: EsrpRelease@11
                displayName: 'Publish npm package through ESRP'
                inputs:
                  ConnectedServiceName: $(ESRP_SERVICE_CONNECTION)
                  ClientId: '$(ESRP_CLIENT_ID)'
                  DomainTenantId: '$(ESRP_TENANT_ID)'
                  UseManagedIdentity: true
                  KeyVaultName: '$(ESRP_KEY_VAULT_NAME)'
                  SignCertName: '$(ESRP_SIGN_CERT_NAME)'
                  Intent: 'PackageDistribution'
                  ContentType: 'npm'
                  ContentSource: 'Folder'
                  FolderLocation: '$(Pipeline.Workspace)/esrp-release/$(Build.BuildId)/socketio'
                  Owners: '$(ESRP_OWNERS)'
                  Approvers: '$(ESRP_APPROVERS)'
                  ServiceEndpointUrl: 'https://api.esrp.microsoft.com'
                  MainPublisher: '$(ESRP_MAIN_PUBLISHER)'
                  ProductState: '$(productState)'

          - job: tunnel_publish
            displayName: 'Publish awps-tunnel through ESRP'
            dependsOn: []
            condition: |
              and(
                not(canceled()),
                eq(variables['checkResult'], 'Succeeded')
              )
            pool:
              type: release
              os: windows
            variables:
              checkResult: $[ stageDependencies.npm_release_prepare.tunnel_check.result ]
              releaseVersion: $[ stageDependencies.release_check.check.outputs['read.tunnel_releaseVersion'] ]
              productState: $[ stageDependencies.release_check.check.outputs['read.tunnel_productState'] ]
              ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
              ob_sdl_codeSignValidation_enabled: false
              ob_sdl_binskim_enabled: false
            templateContext:
              inputs:
                - input: pipelineArtifact
                  artifactName: 'drop_awps-tunnel'
                  targetPath: '$(Pipeline.Workspace)/esrp-release/$(Build.BuildId)/tunnel'
            steps:
              - task: EsrpRelease@11
                displayName: 'Publish npm package through ESRP'
                inputs:
                  ConnectedServiceName: $(ESRP_SERVICE_CONNECTION)
                  ClientId: '$(ESRP_CLIENT_ID)'
                  DomainTenantId: '$(ESRP_TENANT_ID)'
                  UseManagedIdentity: true
                  KeyVaultName: '$(ESRP_KEY_VAULT_NAME)'
                  SignCertName: '$(ESRP_SIGN_CERT_NAME)'
                  Intent: 'PackageDistribution'
                  ContentType: 'npm'
                  ContentSource: 'Folder'
                  FolderLocation: '$(Pipeline.Workspace)/esrp-release/$(Build.BuildId)/tunnel'
                  Owners: '$(ESRP_OWNERS)'
                  Approvers: '$(ESRP_APPROVERS)'
                  ServiceEndpointUrl: 'https://api.esrp.microsoft.com'
                  MainPublisher: '$(ESRP_MAIN_PUBLISHER)'
                  ProductState: '$(productState)'

      - stage: npm_release_finalize
        displayName: 'Tag published npm packages and open next-beta PRs'
        isSkippable: false
        dependsOn:
          - release_check
          - Prod_npm_release
          - npm_release_prepare
          - Prod_npm_publish
        condition: |
          and(
            not(canceled()),
            eq(dependencies.Prod_npm_release.result, 'Succeeded')
          )
        jobs:
          - job: chat_client_post_deploy_tag
            displayName: 'Tag web-pubsub-chat-client release'
            dependsOn: []
            condition: |
              and(
                not(canceled()),
                eq(variables['checkResult'], 'Succeeded'),
                eq(variables['publishResult'], 'Succeeded')
              )
            pool:
              type: linux
            variables:
              checkResult: $[ stageDependencies.npm_release_prepare.chat_client_check.result ]
              publishResult: $[ stageDependencies.Prod_npm_publish.chat_client_publish.result ]
              releaseVersion: $[ stageDependencies.release_check.check.outputs['read.chat_client_releaseVersion'] ]
              ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
              ob_sdl_codeSignValidation_enabled: false
              ob_sdl_binskim_enabled: false
            steps:
              - checkout: self
                path: s/azure-webpubsub
                fetchDepth: 1
                fetchTags: true
                persistCredentials: true
              - task: Bash@3
                displayName: 'Create and push release tag'
                inputs:
                  targetType: inline
                  workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
                  script: |
                    set -euo pipefail
                    tag="release/web-pubsub-chat-client/v$(releaseVersion)"

                    if git rev-parse --verify "refs/tags/${tag}" >/dev/null 2>&1; then
                      echo "Tag ${tag} already exists locally. Skipping."
                      exit 0
                    fi

                    git config --global user.name 'azure-webpubsub-release-bot'
                    git config --global user.email 'azure-webpubsub-release-bot@users.noreply.github.com'
                    git tag "${tag}"
                    git push origin "${tag}"

          - job: chat_client_post_deploy_pr
            displayName: 'Open web-pubsub-chat-client beta bump PR'
            dependsOn: chat_client_post_deploy_tag
            condition: |
              and(
                not(canceled()),
                eq(variables['checkResult'], 'Succeeded'),
                eq(variables['publishResult'], 'Succeeded'),
                eq(dependencies.chat_client_post_deploy_tag.result, 'Succeeded')
              )
            pool:
              type: linux
            variables:
              checkResult: $[ stageDependencies.npm_release_prepare.chat_client_check.result ]
              publishResult: $[ stageDependencies.Prod_npm_publish.chat_client_publish.result ]
              releaseVersion: $[ stageDependencies.release_check.check.outputs['read.chat_client_releaseVersion'] ]
              ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
              ob_sdl_codeSignValidation_enabled: false
              ob_sdl_binskim_enabled: false
            steps:
              - checkout: self
                path: s/azure-webpubsub
                fetchDepth: 1
                persistCredentials: true
              - task: UseNode@1
                displayName: 'Use Node 22.x'
                inputs:
                  version: 22.x
              - task: Bash@3
                displayName: 'Bump package.json and changelog, then open GitHub PR'
                inputs:
                  targetType: inline
                  workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
                  script: |
                    set -euo pipefail

                    PACKAGE_FOLDER='sdk/webpubsub-chat-client'
                    PACKAGE_NAME='web-pubsub-chat-client'

                    package_json="$PACKAGE_FOLDER/package.json"
                    current_version='$(releaseVersion)'
                    new_version=$(node .pipelines/scripts/Npm-Release.mjs bump "$PACKAGE_FOLDER" "$current_version")
                    branch="auto/upv-${PACKAGE_NAME}-${new_version}"
                    echo "Current: $current_version  ->  Next: $new_version"
                    echo "Branch:  $branch"

                    git config --global user.name 'azure-webpubsub-release-bot'
                    git config --global user.email 'azure-webpubsub-release-bot@users.noreply.github.com'
                    git checkout -b "$branch"
                    git add "$package_json" "$PACKAGE_FOLDER/CHANGELOG.md"
                    git commit -m "Update ${PACKAGE_NAME} to next beta version ${new_version}"
                    git push origin "$branch"

                    auth_header=$(git config --get-urlmatch http.extraheader "https://github.com/Azure/azure-webpubsub" || true)
                    if [ -z "$auth_header" ]; then
                      echo "ERROR: no extraheader found in .git/config. Is checkout.persistCredentials true?"
                      exit 1
                    fi

                    pr_body=$(BRANCH="$branch" NEW_VERSION="$new_version" PACKAGE_NAME="$PACKAGE_NAME" node -e "console.log(JSON.stringify({
                      title: 'Update package.json to next beta version ' + process.env.NEW_VERSION,
                      head: process.env.BRANCH,
                      base: 'main',
                      body: 'This PR updates ' + process.env.PACKAGE_NAME + ' package.json and CHANGELOG.md to the next beta version.'
                    }))")

                    curl -fsSL -X POST \
                      -H "$auth_header" \
                      -H 'Accept: application/vnd.github+json' \
                      -H 'X-GitHub-Api-Version: 2022-11-28' \
                      "https://api.github.com/repos/Azure/azure-webpubsub/pulls" \
                      -d "$pr_body"

          - job: socketio_post_deploy_tag
            displayName: 'Tag webpubsub-socketio-extension release'
            dependsOn: []
