# Build all packages; start and approve each release on demand.

name: package-release_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  # Release entry stages are manual, so ordinary CI runs finish without approvals.
  batch: true
  branches:
    include:
      - main

pr: none

variables:
  - group: 'npm-release'
  - name: CDP_DEFINITION_BUILD_COUNT
    value: $[counter('', 0)]
  - name: LinuxContainerImage
    value: 'mcr.microsoft.com/onebranch/azurelinux/build:3.0'

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main

extends:
  template: v2/OneBranch.Official.CrossPlat.yml@templates
  parameters:
    featureFlags:
      # Keep the 1ES publishing path when using a release-stage server approval job.
      use1esentry: true
      linuxEsrpSigning: true
      WindowsHostVersion:
        Version: 2022
    release:
      category: NonAzure
    globalSdl:
      tsa:
        enabled: false
      policheck:
        break: true
    stages:
      - stage: release_check
        displayName: 'Check versions'
        isSkippable: false
        dependsOn: []
        condition: |
          and(
            not(canceled()),
            or(
              eq(variables['Build.SourceBranch'], 'refs/heads/main'),
              eq(variables['Build.Reason'], 'Manual')
            )
          )
        jobs:
          - job: check
            pool:
              type: linux
            variables:
              ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
              ob_sdl_codeSignValidation_enabled: false
              ob_sdl_binskim_enabled: false
            steps:
              - checkout: self
                path: s/azure-webpubsub
                fetchDepth: 1
                persistCredentials: false
              - task: UseNode@1
                displayName: 'Use Node 22.x'
                inputs:
                  version: '22.x'
              - task: Bash@3
                name: read
                displayName: 'Validate versions'
                inputs:
                  targetType: inline
                  workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
                  script: |
                    set -euo pipefail
                    node .pipelines/scripts/Get-ReleasePackages.mjs

      - stage: emulator_build
        displayName: 'Build emulator'
        isSkippable: false
        dependsOn: release_check
        condition: |
          and(
            not(canceled()),
            eq(dependencies.release_check.result, 'Succeeded')
          )
        jobs:
          - job: build
            pool:
              type: linux
            variables:
              ob_outputDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub/out/emulator'
              ob_artifactBaseName: 'drop_emulator'
              ob_sdl_codeSignValidation_enabled: false
              ob_sdl_binskim_enabled: false
            steps:
              - checkout: self
                path: s/azure-webpubsub
                persistCredentials: false
                env:
                  # Relocate and clean the checkout before the signing watcher starts.
                  ob_restore_phase: true
              - task: UseDotNet@2
                displayName: 'Use .NET SDK'
                inputs:
                  useGlobalJson: true
                  workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub/tools/emulator'
              - task: PowerShell@2
                displayName: 'Build and test emulator'
                inputs:
                  pwsh: true
                  targetType: inline
                  workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
                  script: |
                    & ./.pipelines/scripts/Build-EmulatorPackage.ps1 `
                      -OutputDirectory '$(ob_outputDirectory)/release' `
                      -BuildId $env:BUILD_BUILDID -ReleaseVersion -Phase Build
              - task: onebranch.pipeline.signing@1
                displayName: 'Sign assembly'
                inputs:
                  command: sign
                  signing_profile: external_distribution
                  # Tool packing consumes obj, not bin, even with --no-build.
                  files_to_sign: 'obj/Release/*/Microsoft.Azure.WebPubSub.Emulator.dll'
                  search_root: '$(Pipeline.Workspace)/s/azure-webpubsub/tools/emulator/src/Microsoft.Azure.WebPubSub.Emulator'
              - task: PowerShell@2
                displayName: 'Pack emulator'
                inputs:
                  pwsh: true
                  targetType: inline
                  workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
                  script: |
                    & ./.pipelines/scripts/Build-EmulatorPackage.ps1 `
                      -OutputDirectory '$(ob_outputDirectory)/release' `
                      -BuildId $env:BUILD_BUILDID -ReleaseVersion -Phase Pack
                    & ./.pipelines/scripts/Build-EmulatorPackage.ps1 `
                      -OutputDirectory '$(ob_outputDirectory)/preview' `
                      -BuildId $env:BUILD_BUILDID -Phase Pack
              - task: onebranch.pipeline.signing@1
                displayName: 'Sign NuGet package'
                inputs:
                  command: sign
                  signing_profile: external_distribution
                  cp_code: CP-401405
                  files_to_sign: '*.nupkg'
                  search_root: '$(ob_outputDirectory)/release'
              - task: PowerShell@2
                displayName: 'Validate packages'
                inputs:
                  pwsh: true
                  targetType: inline
                  workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
                  script: |
                    & ./.pipelines/scripts/Build-EmulatorPackage.ps1 `
                      -OutputDirectory '$(ob_outputDirectory)/release' `
                      -BuildId $env:BUILD_BUILDID -ReleaseVersion -Phase Validate -RequireSignature
                    & ./.pipelines/scripts/Build-EmulatorPackage.ps1 `
                      -OutputDirectory '$(ob_outputDirectory)/preview' `
                      -BuildId $env:BUILD_BUILDID -Phase Validate

      - template: templates/stages/release-package.yml
        parameters:
          package_key: chat_client
          package_title: chat client
          package_name: web-pubsub-chat-client
          npm_package_name: '@azure/web-pubsub-chat-client'
          package_folder: sdk/webpubsub-chat-client
          pack_steps:
            - task: Bash@3
              displayName: 'Pack chat client'
              inputs:
                targetType: inline
                workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
                script: |
                  set -euo pipefail
                  pushd sdk/webpubsub-chat-client
                  yarn --frozen-lockfile
                  npm run pack:publish
                  yarn test:unit
                  popd

      - template: templates/stages/release-package.yml
        parameters:
          package_key: socketio
          package_title: Socket.IO
          package_name: webpubsub-socketio-extension
          npm_package_name: '@azure/web-pubsub-socket.io'
          package_folder: sdk/webpubsub-socketio-extension
          pack_steps:
            - task: Bash@3
              displayName: 'Pack Socket.IO'
              inputs:
                targetType: inline
                workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
                script: |
                  set -euo pipefail
                  pushd sdk/server-proxies
                  yarn --frozen-lockfile
                  popd
                  pushd tools/awps-tunnel/client
                  yarn --frozen-lockfile
                  popd
                  pushd sdk/webpubsub-socketio-extension
                  yarn --frozen-lockfile
                  yarn build
                  yarn lint
                  yarn test:unit
                  yarn pack
                  popd

      - template: templates/stages/release-package.yml
        parameters:
          package_key: tunnel
          package_title: tunnel
          package_name: awps-tunnel
          npm_package_name: '@azure/web-pubsub-tunnel-tool'
          package_folder: tools/awps-tunnel/server
          pack_steps:
            - task: Bash@3
              displayName: 'Pack tunnel'
              inputs:
                targetType: inline
                workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
                script: |
                  set -euo pipefail
                  pushd sdk/server-proxies
                  yarn --frozen-lockfile
                  popd
                  pushd tools/awps-tunnel/client
                  yarn --frozen-lockfile
                  popd
                  pushd tools/awps-tunnel/server
                  yarn --frozen-lockfile
                  yarn build
                  yarn test:unit --runInBand
                  yarn pack
                  popd

      - stage: emulator_myget
        displayName: 'Publish MyGet preview'
        isSkippable: false
        dependsOn:
          - release_check
          - emulator_build
        condition: |
          and(
            not(canceled()),
            eq(dependencies.release_check.result, 'Succeeded'),
            eq(dependencies.emulator_build.result, 'Succeeded'),
            or(
              eq(variables['Build.SourceBranch'], 'refs/heads/main'),
              eq(variables['Build.Reason'], 'Manual')
            )
          )
        variables:
          ob_release_environment: Test
        jobs:
          - job: publish
            pool:
              type: release
              os: windows
            variables:
              ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
              ob_sdl_codeSignValidation_enabled: false
              ob_sdl_binskim_enabled: false
            templateContext:
              inputs:
                - input: pipelineArtifact
                  artifactName: drop_emulator
                  targetPath: '$(Pipeline.Workspace)/drop_emulator'
            steps:
              - task: UseDotNet@2
                displayName: 'Use .NET 8'
                inputs:
                  version: '8.x'
              # The OneBranch NuGetCommand wrapper forces DotNet, which cannot use this API-key connection.
              - task: 1ES.PublishNuGet@1
                displayName: 'Publish to MyGet'
                inputs:
                  useDotNetTask: false
                  packageParentPath: '$(Pipeline.Workspace)/drop_emulator/preview'
                  packagesToPush: '$(Pipeline.Workspace)/drop_emulator/preview/*.nupkg'
                  nuGetFeedType: external
                  publishFeedCredentials: azure-webpubsub-dev

      # Start only the packages to release. Unstarted entries do not wait for approval.
      # Preflight checks are manual; approval still requires this run's successful build.
      - stage: emulator_release_check
        displayName: 'Release emulator'
        trigger: manual
        isSkippable: true
        # Azure DevOps manual stages cannot declare stage dependencies.
        # The approval stage below checks this run's version and package build.
        condition: |
          and(
            not(canceled()),
            or(
              eq(variables['Build.SourceBranch'], 'refs/heads/main'),
              eq(variables['Build.Reason'], 'Manual')
            )
          )
        jobs:
          - job: emulator_check
            displayName: 'Check release artifact'
            condition: not(canceled())
            pool:
              type: linux
            variables:
              ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
              ob_sdl_codeSignValidation_enabled: false
              ob_sdl_binskim_enabled: false
            steps:
              - checkout: self
                fetchDepth: 1
                persistCredentials: false
              - task: DownloadPipelineArtifact@2
                displayName: 'Download release package'
                inputs:
                  buildType: current
                  artifactName: drop_emulator
                  itemPattern: 'release/*.nupkg'
                  targetPath: '$(Pipeline.Workspace)/drop_emulator'
              - task: PowerShell@2
                displayName: 'Check release artifact'
                inputs:
                  pwsh: true
                  targetType: inline
                  script: |
                    $ErrorActionPreference = 'Stop'
                    $packages = @(Get-ChildItem -LiteralPath $env:PACKAGE_DIRECTORY -Filter '*.nupkg')
                    if ($packages.Count -ne 1) {
                      throw 'Expected one emulator release package. Start this stage after the emulator build succeeds.'
                    }
                    Write-Host "Release package: $($packages[0].Name)"
                env:
                  PACKAGE_DIRECTORY: '$(Pipeline.Workspace)/drop_emulator/release'

      - stage: Prod_emulator_approve
        displayName: 'Approve emulator'
        isSkippable: false
        dependsOn:
          - release_check
          - emulator_build
          - emulator_release_check
        condition: |
          and(
            not(canceled()),
            eq(dependencies.release_check.result, 'Succeeded'),
            eq(dependencies.emulator_build.result, 'Succeeded'),
            eq(dependencies.emulator_release_check.result, 'Succeeded')
          )
        variables:
          ob_release_environment: Production
        jobs:
          - job: emulator_approve
            displayName: 'Approve emulator'
            condition: not(canceled())
            pool:
              type: server
            variables:
              releaseVersion: $[ stageDependencies.release_check.check.outputs['read.emulator_releaseVersion'] ]
            timeoutInMinutes: 1500
            steps:
              - task: ManualValidation@1
                displayName: 'Approve emulator'
                timeoutInMinutes: 1440
                inputs:
                  notifyUsers: ''
                  allowApproversToApproveTheirOwnRuns: true
                  instructions: |
                    Prepare Microsoft.Azure.WebPubSub.Emulator $(releaseVersion) for NuGet.org.
                    Review the build artifacts and source: $(Build.SourceBranch) @ $(Build.SourceVersion).
                    Resume to create the release artifact; Reject to skip it. Other packages are independent.
                    NuGet.org publication is not enabled yet. Download drop_emulator_nuget after this stage.
                  onTimeout: reject

      # Placeholder until NuGet.org publishing is configured.
      - stage: emulator_release_prepare
        displayName: 'Prepare NuGet artifact'
        isSkippable: false
        dependsOn:
          - release_check
          - Prod_emulator_approve
        condition: |
          and(
            not(canceled()),
            eq(dependencies.Prod_emulator_approve.result, 'Succeeded')
          )
        jobs:
          - job: emulator_prepare
            displayName: 'Prepare NuGet artifact'
            condition: not(canceled())
            pool:
              type: linux
            variables:
              releaseVersion: $[ stageDependencies.release_check.check.outputs['read.emulator_releaseVersion'] ]
              ob_outputDirectory: '$(Build.ArtifactStagingDirectory)/nuget'
              ob_artifactBaseName: drop_emulator_nuget
              ob_sdl_codeSignValidation_enabled: false
              ob_sdl_binskim_enabled: false
            steps:
              - checkout: self
                fetchDepth: 1
                persistCredentials: false
              - task: DownloadPipelineArtifact@2
                displayName: 'Download release package'
                inputs:
                  buildType: current
                  artifactName: drop_emulator
                  itemPattern: 'release/*.nupkg'
                  targetPath: '$(Pipeline.Workspace)/drop_emulator'
              - task: PowerShell@2
                displayName: 'Prepare NuGet artifact'
                inputs:
                  pwsh: true
                  targetType: inline
                  script: |
                    $ErrorActionPreference = 'Stop'
                    if (-not (Test-Path -LiteralPath $env:PACKAGE_PATH -PathType Leaf)) {
                      throw 'The approved emulator release package was not found.'
                    }
                    New-Item -ItemType Directory -Path $env:OUTPUT_DIRECTORY -Force | Out-Null
                    Copy-Item -LiteralPath $env:PACKAGE_PATH -Destination $env:OUTPUT_DIRECTORY
                    Write-Host 'NuGet release artifact is ready. NuGet.org publication is not enabled yet.'
                env:
                  PACKAGE_PATH: '$(Pipeline.Workspace)/drop_emulator/release/Microsoft.Azure.WebPubSub.Emulator.$(releaseVersion).nupkg'
                  OUTPUT_DIRECTORY: $(ob_outputDirectory)

      - stage: chat_client_release_check
        displayName: 'Release chat client'
        trigger: manual
        isSkippable: true
        # Azure DevOps manual stages cannot declare stage dependencies.
        # The approval stage below checks this run's version and package build.
        condition: |
          and(
            not(canceled()),
            or(
              eq(variables['Build.SourceBranch'], 'refs/heads/main'),
              eq(variables['Build.Reason'], 'Manual')
            )
          )
        jobs:
          - job: chat_client_check
            displayName: 'Check chat client'
            condition: not(canceled())
            pool:
              type: linux
            variables:
              ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
              ob_sdl_codeSignValidation_enabled: false
              ob_sdl_binskim_enabled: false
            steps:
              - checkout: self
                path: s/azure-webpubsub
                fetchDepth: 1
                persistCredentials: true
              - task: UseNode@1
                displayName: 'Use Node 22.x'
                inputs:
                  version: 22.x
              - task: PowerShell@2
                displayName: 'Check npm and tag'
                inputs:
                  pwsh: true
                  targetType: inline
                  workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
                  script: |
                    $ErrorActionPreference = 'Stop'
                    $releaseVersion = (Get-Content -LiteralPath 'sdk/webpubsub-chat-client/package.json' -Raw | ConvertFrom-Json).version
                    & node .pipelines/scripts/Npm-Release.mjs check `
                      'sdk/webpubsub-chat-client' `
                      '@azure/web-pubsub-chat-client' `
                      'web-pubsub-chat-client' `
                      $releaseVersion `
                      'Azure/azure-webpubsub'
                    if ($LASTEXITCODE -ne 0) { throw 'Public package availability checks failed.' }

      - stage: Prod_chat_client_approve
        displayName: 'Approve chat client'
        isSkippable: false
        dependsOn:
          - release_check
          - chat_client_build
          - chat_client_release_check
        condition: |
          and(
            not(canceled()),
            eq(dependencies.release_check.result, 'Succeeded'),
            eq(dependencies.chat_client_build.result, 'Succeeded'),
            eq(dependencies.chat_client_release_check.result, 'Succeeded')
          )
        variables:
          ob_release_environment: Production
        jobs:
          - job: chat_client_approve
            displayName: 'Approve chat client'
            condition: not(canceled())
            pool:
              type: server
            variables:
              releaseVersion: $[ stageDependencies.release_check.check.outputs['read.chat_client_releaseVersion'] ]
            timeoutInMinutes: 1500
            steps:
              - task: ManualValidation@1
                displayName: 'Approve chat client'
                timeoutInMinutes: 1440
                inputs:
                  notifyUsers: ''
                  allowApproversToApproveTheirOwnRuns: true
                  instructions: |
                    Publish @azure/web-pubsub-chat-client $(releaseVersion) to npm.
                    Review the build artifacts and source: $(Build.SourceBranch) @ $(Build.SourceVersion).
                    Resume to publish this package; Reject to skip it. Other packages are independent.
                    Publication also creates its release tag and next-beta PR.
                  onTimeout: reject

      - stage: Prod_chat_client_publish
        displayName: 'Publish chat client'
        isSkippable: false
        dependsOn:
          - release_check
          - Prod_chat_client_approve
          - chat_client_release_check
        condition: |
          and(
            not(canceled()),
            eq(dependencies.Prod_chat_client_approve.result, 'Succeeded'),
            eq(dependencies.chat_client_release_check.result, 'Succeeded')
          )
        variables:
          ob_release_environment: Production
        jobs:
          - job: chat_client_publish
            displayName: 'Publish chat client'
            dependsOn: []
            condition: |
              and(
                not(canceled()),
                eq(variables['checkResult'], 'Succeeded')
              )
            pool:
              type: release
              os: windows
            variables:
              checkResult: $[ stageDependencies.chat_client_release_check.chat_client_check.result ]
              releaseVersion: $[ stageDependencies.release_check.check.outputs['read.chat_client_releaseVersion'] ]
              productState: $[ stageDependencies.release_check.check.outputs['read.chat_client_productState'] ]
              ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
              ob_sdl_codeSignValidation_enabled: false
              ob_sdl_binskim_enabled: false
            templateContext:
              inputs:
                - input: pipelineArtifact
                  artifactName: 'drop_web-pubsub-chat-client'
                  targetPath: '$(Pipeline.Workspace)/esrp-release/$(Build.BuildId)/chat_client'
            steps:
              - task: EsrpRelease@11
                displayName: 'Publish to npm'
                inputs:
                  ConnectedServiceName: $(ESRP_SERVICE_CONNECTION)
                  ClientId: '$(ESRP_CLIENT_ID)'
                  DomainTenantId: '$(ESRP_TENANT_ID)'
                  UseManagedIdentity: true
                  KeyVaultName: '$(ESRP_KEY_VAULT_NAME)'
                  SignCertName: '$(ESRP_SIGN_CERT_NAME)'
                  Intent: 'PackageDistribution'
                  ContentType: 'npm'
                  ContentSource: 'Folder'
                  FolderLocation: '$(Pipeline.Workspace)/esrp-release/$(Build.BuildId)/chat_client'
                  Owners: '$(ESRP_OWNERS)'
                  Approvers: '$(ESRP_APPROVERS)'
                  ServiceEndpointUrl: 'https://api.esrp.microsoft.com'
                  MainPublisher: '$(ESRP_MAIN_PUBLISHER)'
                  ProductState: '$(productState)'

      - stage: chat_client_release_finalize
        displayName: 'Finalize chat client'
        isSkippable: false
        dependsOn:
          - release_check
          - Prod_chat_client_approve
          - chat_client_release_check
          - Prod_chat_client_publish
        condition: |
          and(
            not(canceled()),
            eq(dependencies.Prod_chat_client_approve.result, 'Succeeded'),
            eq(dependencies.chat_client_release_check.result, 'Succeeded'),
            eq(dependencies.Prod_chat_client_publish.result, 'Succeeded')
          )
        jobs:
          - job: chat_client_post_deploy_tag
            displayName: 'Tag chat client'
            dependsOn: []
            condition: |
              and(
                not(canceled()),
                eq(variables['checkResult'], 'Succeeded'),
                eq(variables['publishResult'], 'Succeeded')
              )
            pool:
              type: linux
            variables:
              checkResult: $[ stageDependencies.chat_client_release_check.chat_client_check.result ]
              publishResult: $[ stageDependencies.Prod_chat_client_publish.chat_client_publish.result ]
              releaseVersion: $[ stageDependencies.release_check.check.outputs['read.chat_client_releaseVersion'] ]
              ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
              ob_sdl_codeSignValidation_enabled: false
              ob_sdl_binskim_enabled: false
            steps:
              - checkout: self
                path: s/azure-webpubsub
                fetchDepth: 1
                fetchTags: true
                persistCredentials: true
              - task: Bash@3
                displayName: 'Push release tag'
                inputs:
                  targetType: inline
                  workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
                  script: |
                    set -euo pipefail
                    tag="release/web-pubsub-chat-client/v$(releaseVersion)"

                    if git rev-parse --verify "refs/tags/${tag}" >/dev/null 2>&1; then
                      echo "Tag ${tag} already exists locally. Skipping."
                      exit 0
                    fi

                    git config --global user.name 'azure-webpubsub-release-bot'
                    git config --global user.email 'azure-webpubsub-release-bot@users.noreply.github.com'
                    git tag "${tag}"
                    git push origin "${tag}"

          - job: chat_client_post_deploy_pr
            displayName: 'Bump chat client'
            dependsOn: chat_client_post_deploy_tag
            condition: |
              and(
                not(canceled()),
                eq(variables['checkResult'], 'Succeeded'),
                eq(variables['publishResult'], 'Succeeded'),
                eq(dependencies.chat_client_post_deploy_tag.result, 'Succeeded')
              )
            pool:
              type: linux
            variables:
              checkResult: $[ stageDependencies.chat_client_release_check.chat_client_check.result ]
              publishResult: $[ stageDependencies.Prod_chat_client_publish.chat_client_publish.result ]
              releaseVersion: $[ stageDependencies.release_check.check.outputs['read.chat_client_releaseVersion'] ]
              ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
              ob_sdl_codeSignValidation_enabled: false
              ob_sdl_binskim_enabled: false
            steps:
              - checkout: self
                path: s/azure-webpubsub
                fetchDepth: 1
                persistCredentials: true
              - task: UseNode@1
                displayName: 'Use Node 22.x'
                inputs:
                  version: 22.x
              - task: Bash@3
                displayName: 'Open next-beta PR'
                inputs:
                  targetType: inline
                  workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
                  script: |
                    set -euo pipefail

                    PACKAGE_FOLDER='sdk/webpubsub-chat-client'
                    PACKAGE_NAME='web-pubsub-chat-client'

                    package_json="$PACKAGE_FOLDER/package.json"
                    current_version='$(releaseVersion)'
                    new_version=$(node .pipelines/scripts/Npm-Release.mjs bump "$PACKAGE_FOLDER" "$current_version")
                    branch="auto/upv-${PACKAGE_NAME}-${new_version}"
                    echo "Current: $current_version  ->  Next: $new_version"
                    echo "Branch:  $branch"

                    git config --global user.name 'azure-webpubsub-release-bot'
                    git config --global user.email 'azure-webpubsub-release-bot@users.noreply.github.com'
                    git checkout -b "$branch"
                    git add "$package_json" "$PACKAGE_FOLDER/CHANGELOG.md"
                    git commit -m "Update ${PACKAGE_NAME} to next beta version ${new_version}"
                    git push origin "$branch"

                    auth_header=$(git config --get-urlmatch http.extraheader "https://github.com/Azure/azure-webpubsub" || true)
                    if [ -z "$auth_header" ]; then
                      echo "ERROR: no extraheader found in .git/config. Is checkout.persistCredentials true?"
                      exit 1
                    fi

                    pr_body=$(BRANCH="$branch" NEW_VERSION="$new_version" PACKAGE_NAME="$PACKAGE_NAME" node -e "console.log(JSON.stringify({
                      title: 'Update package.json to next beta version ' + process.env.NEW_VERSION,
                      head: process.env.BRANCH,
                      base: 'main',
                      body: 'This PR updates ' + process.env.PACKAGE_NAME + ' package.json and CHANGELOG.md to the next beta version.'
                    }))")

                    curl -fsSL -X POST \
                      -H "$auth_header" \
                      -H 'Accept: application/vnd.github+json' \
                      -H 'X-GitHub-Api-Version: 2022-11-28' \
                      "https://api.github.com/repos/Azure/azure-webpubsub/pulls" \
                      -d "$pr_body"

      - stage: socketio_release_check
        displayName: 'Release Socket.IO'
        trigger: manual
        isSkippable: true
        # Azure DevOps manual stages cannot declare stage dependencies.
        # The approval stage below checks this run's version and package build.
        condition: |
          and(
            not(canceled()),
            or(
              eq(variables['Build.SourceBranch'], 'refs/heads/main'),
              eq(variables['Build.Reason'], 'Manual')
            )
          )
        jobs:
          - job: socketio_check
            displayName: 'Check Socket.IO'
            condition: not(canceled())
            pool:
              type: linux
            variables:
              ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
              ob_sdl_codeSignValidation_enabled: false
              ob_sdl_binskim_enabled: false
            steps:
              - checkout: self
                path: s/azure-webpubsub
                fetchDepth: 1
                persistCredentials: true
