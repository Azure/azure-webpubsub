# Build all packages; start and approve each release on demand.

name: package-release_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  # Manual release stages stay unstarted during ordinary CI runs.
  batch: true
  branches:
    include:
      - main

pr: none

variables:
  - group: 'npm-release'
  - name: CDP_DEFINITION_BUILD_COUNT
    value: $[counter('', 0)]
  - name: LinuxContainerImage
    value: 'mcr.microsoft.com/onebranch/azurelinux/build:3.0'

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main

extends:
  template: v2/OneBranch.Official.CrossPlat.yml@templates
  parameters:
    featureFlags:
      # Keep the 1ES publishing path when using a release-stage server approval job.
      use1esentry: true
      linuxEsrpSigning: true
      WindowsHostVersion:
        Version: 2022
    release:
      category: NonAzure
    globalSdl:
      tsa:
        enabled: false
      policheck:
        break: true
    stages:
      - stage: emulator_build
        displayName: 'Build emulator'
        isSkippable: false
        dependsOn: []
        condition: |
          and(
            not(canceled()),
            or(
              eq(variables['Build.SourceBranch'], 'refs/heads/main'),
              eq(variables['Build.Reason'], 'Manual')
            )
          )
        jobs:
          - job: build
            pool:
              type: linux
            variables:
              ob_outputDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub/out/emulator'
              ob_artifactBaseName: 'drop_emulator'
              ob_sdl_codeSignValidation_enabled: false
              ob_sdl_binskim_enabled: false
            steps:
              - checkout: self
                path: s/azure-webpubsub
                persistCredentials: false
                env:
                  # Relocate and clean the checkout before the signing watcher starts.
                  ob_restore_phase: true
              - task: UseNode@1
                displayName: 'Use Node 22.x'
                inputs:
                  version: '22.x'
              - task: Bash@3
                name: read
                displayName: 'Check version'
                inputs:
                  targetType: inline
                  workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
                  script: |
                    set -euo pipefail
                    node .pipelines/scripts/Get-ReleasePackages.mjs emulator
              - task: UseDotNet@2
                displayName: 'Use .NET SDK'
                inputs:
                  useGlobalJson: true
                  workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub/tools/emulator'
              - task: PowerShell@2
                displayName: 'Build and test emulator'
                inputs:
                  pwsh: true
                  targetType: inline
                  workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
                  script: |
                    & ./.pipelines/scripts/Build-EmulatorPackage.ps1 `
                      -OutputDirectory '$(ob_outputDirectory)/release' `
                      -BuildId $env:BUILD_BUILDID -ReleaseVersion -Phase Build
              - task: onebranch.pipeline.signing@1
                displayName: 'Sign assembly'
                inputs:
                  command: sign
                  signing_profile: external_distribution
                  # Tool packing consumes obj, not bin, even with --no-build.
                  files_to_sign: 'obj/Release/*/Microsoft.Azure.WebPubSub.Emulator.dll'
                  search_root: '$(Pipeline.Workspace)/s/azure-webpubsub/tools/emulator/src/Microsoft.Azure.WebPubSub.Emulator'
              - task: PowerShell@2
                displayName: 'Pack emulator'
                inputs:
                  pwsh: true
                  targetType: inline
                  workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
                  script: |
                    & ./.pipelines/scripts/Build-EmulatorPackage.ps1 `
                      -OutputDirectory '$(ob_outputDirectory)/release' `
                      -BuildId $env:BUILD_BUILDID -ReleaseVersion -Phase Pack
                    & ./.pipelines/scripts/Build-EmulatorPackage.ps1 `
                      -OutputDirectory '$(ob_outputDirectory)/preview' `
                      -BuildId $env:BUILD_BUILDID -Phase Pack
              - task: onebranch.pipeline.signing@1
                displayName: 'Sign NuGet package'
                inputs:
                  command: sign
                  signing_profile: external_distribution
                  cp_code: CP-401405
                  files_to_sign: '*.nupkg'
                  search_root: '$(ob_outputDirectory)/release'
              - task: PowerShell@2
                displayName: 'Validate packages'
                inputs:
                  pwsh: true
                  targetType: inline
                  workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
                  script: |
                    & ./.pipelines/scripts/Build-EmulatorPackage.ps1 `
                      -OutputDirectory '$(ob_outputDirectory)/release' `
                      -BuildId $env:BUILD_BUILDID -ReleaseVersion -Phase Validate -RequireSignature
                    & ./.pipelines/scripts/Build-EmulatorPackage.ps1 `
                      -OutputDirectory '$(ob_outputDirectory)/preview' `
                      -BuildId $env:BUILD_BUILDID -Phase Validate

      - template: templates/stages/release-package.yml
        parameters:
          package_key: chat_client
          package_title: chat client
          package_name: web-pubsub-chat-client
          npm_package_name: '@azure/web-pubsub-chat-client'
          package_folder: sdk/webpubsub-chat-client
          pack_steps:
            - task: Bash@3
              displayName: 'Pack chat client'
              inputs:
                targetType: inline
                workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
                script: |
                  set -euo pipefail
                  pushd sdk/webpubsub-chat-client
                  yarn --frozen-lockfile
                  npm run pack:publish
                  yarn test:unit
                  popd

      - template: templates/stages/release-package.yml
        parameters:
          package_key: socketio
          package_title: Socket.IO
          package_name: webpubsub-socketio-extension
          npm_package_name: '@azure/web-pubsub-socket.io'
          package_folder: sdk/webpubsub-socketio-extension
          pack_steps:
            - task: Bash@3
              displayName: 'Pack Socket.IO'
              inputs:
                targetType: inline
                workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
                script: |
                  set -euo pipefail
                  pushd sdk/server-proxies
                  yarn --frozen-lockfile
                  popd
                  pushd tools/awps-tunnel/client
                  yarn --frozen-lockfile
                  popd
                  pushd sdk/webpubsub-socketio-extension
                  yarn --frozen-lockfile
                  yarn build
                  yarn lint
                  yarn test:unit
                  yarn pack
                  popd

      - template: templates/stages/release-package.yml
        parameters:
          package_key: tunnel
          package_title: tunnel
          package_name: awps-tunnel
          npm_package_name: '@azure/web-pubsub-tunnel-tool'
          package_folder: tools/awps-tunnel/server
          pack_steps:
            - task: Bash@3
              displayName: 'Pack tunnel'
              inputs:
                targetType: inline
                workingDirectory: '$(Pipeline.Workspace)/s/azure-webpubsub'
                script: |
                  set -euo pipefail
                  pushd sdk/server-proxies
                  yarn --frozen-lockfile
                  popd
                  pushd tools/awps-tunnel/client
                  yarn --frozen-lockfile
                  popd
                  pushd tools/awps-tunnel/server
                  yarn --frozen-lockfile
                  yarn build
                  yarn test:unit --runInBand
                  yarn pack
                  popd

      - stage: emulator_myget
        displayName: 'Publish MyGet preview'
        isSkippable: false
        dependsOn:
          - emulator_build
        condition: |
          and(
            not(canceled()),
            eq(dependencies.emulator_build.result, 'Succeeded'),
            or(
              eq(variables['Build.SourceBranch'], 'refs/heads/main'),
              eq(variables['Build.Reason'], 'Manual')
            )
          )
        variables:
          ob_release_environment: Test
        jobs:
          - job: publish
            pool:
              type: release
              os: windows
            variables:
              ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
              ob_sdl_codeSignValidation_enabled: false
              ob_sdl_binskim_enabled: false
            templateContext:
              inputs:
                - input: pipelineArtifact
                  artifactName: drop_emulator
                  targetPath: '$(Pipeline.Workspace)/drop_emulator'
            steps:
              - task: UseDotNet@2
                displayName: 'Use .NET 8'
                inputs:
                  version: '8.x'
              # The OneBranch NuGetCommand wrapper forces DotNet, which cannot use this API-key connection.
              - task: 1ES.PublishNuGet@1
                displayName: 'Publish to MyGet'
                inputs:
                  useDotNetTask: false
                  packageParentPath: '$(Pipeline.Workspace)/drop_emulator/preview'
                  packagesToPush: '$(Pipeline.Workspace)/drop_emulator/preview/*.nupkg'
                  nuGetFeedType: external
                  publishFeedCredentials: azure-webpubsub-dev

      # Unstarted release entries do not wait for approval during ordinary CI runs.
      - template: templates/stages/release-approval.yml
        parameters:
          package_key: emulator
          package_title: emulator
          instructions: |
            Prepare Microsoft.Azure.WebPubSub.Emulator from build $(Build.BuildNumber) for NuGet.org.
            Review the package version in drop_emulator/release and source: $(Build.SourceBranch) @ $(Build.SourceVersion).
            Resume to create the release artifact; Reject to skip it. Other packages are independent.
            NuGet.org publication is not enabled yet. Download drop_emulator_nuget after this stage.

      # Placeholder until NuGet.org publishing is configured.
      - stage: emulator_release_prepare
        displayName: 'Prepare NuGet artifact'
        isSkippable: false
        dependsOn:
          - emulator_build
          - Prod_emulator_approve
        condition: |
          and(
            not(canceled()),
            eq(dependencies.emulator_build.result, 'Succeeded'),
            eq(dependencies.Prod_emulator_approve.result, 'Succeeded')
          )
        jobs:
          - job: emulator_prepare
            displayName: 'Prepare NuGet artifact'
            condition: not(canceled())
            pool:
              type: linux
            variables:
              releaseVersion: $[ stageDependencies.emulator_build.build.outputs['read.emulator_releaseVersion'] ]
              ob_outputDirectory: '$(Build.ArtifactStagingDirectory)/nuget'
              ob_artifactBaseName: drop_emulator_nuget
              ob_sdl_codeSignValidation_enabled: false
              ob_sdl_binskim_enabled: false
            steps:
              - checkout: self
                fetchDepth: 1
                persistCredentials: false
              - task: DownloadPipelineArtifact@2
                displayName: 'Download release package'
                inputs:
                  buildType: current
                  artifactName: drop_emulator
                  itemPattern: 'release/*.nupkg'
                  targetPath: '$(Pipeline.Workspace)/drop_emulator'
              - task: PowerShell@2
                displayName: 'Prepare NuGet artifact'
                inputs:
                  pwsh: true
                  targetType: inline
                  script: |
                    $ErrorActionPreference = 'Stop'
                    if (-not (Test-Path -LiteralPath $env:PACKAGE_PATH -PathType Leaf)) {
                      throw 'The approved emulator release package was not found.'
                    }
                    New-Item -ItemType Directory -Path $env:OUTPUT_DIRECTORY -Force | Out-Null
                    Copy-Item -LiteralPath $env:PACKAGE_PATH -Destination $env:OUTPUT_DIRECTORY
                    Write-Host 'NuGet release artifact is ready. NuGet.org publication is not enabled yet.'
                env:
                  PACKAGE_PATH: '$(Pipeline.Workspace)/drop_emulator/release/Microsoft.Azure.WebPubSub.Emulator.$(releaseVersion).nupkg'
                  OUTPUT_DIRECTORY: $(ob_outputDirectory)

      - template: templates/stages/release-npm-package.yml
        parameters:
          package_key: chat_client
          package_title: chat client
          package_name: web-pubsub-chat-client
          npm_package_name: '@azure/web-pubsub-chat-client'
          package_folder: sdk/webpubsub-chat-client

      - template: templates/stages/release-npm-package.yml
        parameters:
          package_key: socketio
          package_title: Socket.IO
          package_name: webpubsub-socketio-extension
          npm_package_name: '@azure/web-pubsub-socket.io'
          package_folder: sdk/webpubsub-socketio-extension

      - template: templates/stages/release-npm-package.yml
        parameters:
          package_key: tunnel
          package_title: tunnel
          package_name: awps-tunnel
          npm_package_name: '@azure/web-pubsub-tunnel-tool'
          package_folder: tools/awps-tunnel/server
